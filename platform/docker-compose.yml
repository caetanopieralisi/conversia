# Sobe a plataforma na VPS que já roda o n8n e a Evolution API.
#
#   cp .env.example .env    # preencha
#   docker compose up -d
#   docker compose logs -f
#
# Diferença para a Vercel: aqui WORKER_MODE fica VAZIO, então a própria
# aplicação processa a fila a cada 3 segundos. O workflow "1 · Motor" do n8n
# passa a ser opcional (pode continuar ativo como rede de segurança — a trava
# no banco impede processamento duplicado).

services:
  conversia:
    build: .
    # ou, se preferir publicar a imagem:
    # image: ghcr.io/seu-usuario/conversia:latest
    container_name: conversia
    restart: unless-stopped
    env_file: .env
    environment:
      WORKER_MODE: ""            # vazio = worker interno (o certo aqui)
      WORKER_INTERVAL_MS: "3000"
      DELIVERY_MODE: "outbox"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # Se o n8n e a Evolution já estão numa rede Docker, descomente para que a
    # plataforma os alcance por nome em vez de IP público:
    # networks: [ rede_do_n8n ]

# networks:
#   rede_do_n8n:
#     external: true
#     name: NOME_DA_REDE   # veja com: docker network ls
